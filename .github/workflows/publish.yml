name: Publish to PyPI

# Publishes git-repokit when a GitHub Release is published (the house rule:
# the release notes exist before the package does). PyPI's trusted publisher
# is registered for this workflow, this repository and the `pypi`
# environment, so no token is stored anywhere.
#
# The alias dazzle-git-repokit publishes from its own job. Its trusted
# publisher on PyPI names this same workflow file, repository and
# environment (djdarcy, 2026-10-25, after git-repokit's first publish worked).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build git-repokit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build the sdist and the wheel
      run: python -m build --outdir dist/

    - name: Verify no private or local-only content leaked into the artifacts
      run: python scripts/check_dist_no_leak.py dist/

    - name: Check the packages' metadata
      run: twine check --strict dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

    # The alias, dazzle-git-repokit: built beside git-repokit, into its own
    # folder, so the steps above stay as they were when git-repokit first
    # published (0.9.10)
    - name: Build the alias (dazzle-git-repokit)
      run: python -m build packages/dazzle-git-repokit-alias/ --outdir dist-alias/

    - name: Verify the alias carries nothing private
      run: python scripts/check_dist_no_leak.py dist-alias/

    - name: Check the alias's metadata
      run: twine check --strict dist-alias/*

    - uses: actions/upload-artifact@v7
      with:
        name: dist-alias
        path: dist-alias/

  publish:
    name: Publish git-repokit
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/git-repokit

    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # a re-run of the same release finds its files already there
        skip-existing: true

  publish-alias:
    name: Publish dazzle-git-repokit
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dazzle-git-repokit

    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist-alias
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
