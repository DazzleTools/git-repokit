[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "__RK_PROJECT__"
dynamic = ["version"]
description = "__RK_DESCRIPTION__"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "__RK_AUTHOR__", email = "__RK_EMAIL__"},
]
keywords = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/__RK_ORG__/__RK_PROJECT__"
Repository = "https://github.com/__RK_ORG__/__RK_PROJECT__"
Issues = "https://github.com/__RK_ORG__/__RK_PROJECT__/issues"

[project.scripts]
__RK_PROJECT__ = "__RK_SNAKE__.cli:main"

[tool.setuptools.dynamic]
version = {attr = "__RK_SNAKE__._version.PIP_VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["__RK_SNAKE__", "__RK_SNAKE__.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.repokit-common]
version-source = "__RK_SNAKE__/_version.py"
changelog = "CHANGELOG.md"
repo-url = "https://github.com/__RK_ORG__/__RK_PROJECT__"
tag-prefix = "v"
private-patterns = ["private/", "local/", ".env"]
