[build-system]
# 77: the PEP 639 license fields (an SPDX `license` string and `license-files`)
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "__RK_PROJECT__"
dynamic = ["version"]
description = "__RK_DESCRIPTION__"
readme = "README.md"
__RK_LICENSE_FIELD__
__RK_LICENSE_FILES__
requires-python = ">=3.10"
authors = [
    {name = "__RK_AUTHOR__", email = "__RK_EMAIL__"},
]
keywords = [__RK_KEYWORDS__]
# No `License ::` classifier: setuptools 77+ refuses one beside a license
# expression (measured 2026-10-25); the `license` field above says it.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/__RK_ORG__/__RK_PROJECT__"
Repository = "https://github.com/__RK_ORG__/__RK_PROJECT__"
Issues = "https://github.com/__RK_ORG__/__RK_PROJECT__/issues"

[project.scripts]
__RK_PROJECT__ = "__RK_SNAKE__.cli:main"

[tool.setuptools.dynamic]
version = {attr = "__RK_SNAKE__._version.PIP_VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["__RK_SNAKE__", "__RK_SNAKE__.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package imports from the project root without an install: the vendored
# pre-push hook runs `python -P -m pytest`, which keeps the root off sys.path,
# and the first push (`repokit create --github`) comes before any pip install.
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.repokit-common]
version-source = "__RK_SNAKE__/_version.py"
changelog = "CHANGELOG.md"
repo-url = "https://github.com/__RK_ORG__/__RK_PROJECT__"
tag-prefix = "v"
private-patterns = ["private/", "local/", ".env"]
