# git-repokit-common settings for __RK_PROJECT__, a Claude Code plugin with Python hooks.
#
# The plugin lives in plugin/ with its own README for the marketplace; this
# root holds the repository's tooling. The version lives in VERSION; the
# vendored tool at scripts/repokit-common/ keeps the plugin manifest in step.
# "human" tags (v0.1.0) match the version Claude Code reads from
# plugin/.claude-plugin/plugin.json. A push runs the plugin's own tests.

[tool.repokit-common]
version-source = "VERSION"
changelog = "CHANGELOG.md"
repo-url = "https://github.com/__RK_ORG__/__RK_PROJECT__"
tag-prefix = "v"
tag-format = "human"
private-patterns = ["private/", "local/", ".env"]
test-command = "python -m pytest plugin/tests -q"

[[tool.repokit-common.extra-targets]]
path = "plugin/.claude-plugin/plugin.json"
type = "json"
field = "version"
