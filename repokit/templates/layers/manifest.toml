# The code-type layers: what each language and archetype adds on top of the
# structure every project gets. Layers are applied in order (each language's,
# then the rest by facet); a later file replaces an earlier one, and a file
# named <name>.rkappend is appended to <name> instead -- including a file the
# structure templates already wrote (.gitignore). __RK_NAME__ tokens are
# replaced in file names and text contents (see repokit/layers.py).
#
# Three tables below the languages:
#
#   [facets.<name>]        the questions a project answers below its language,
#                          in the order the engine applies them; exclusive means
#                          a project has one answer per language
#   [layers."<lang>/<n>"]  one entry per layer folder archetypes/<lang>/<n>:
#                          its facet, what it implies, and whether it is built
#   [archetypes."<lang>/<n>"]  the presets: a named, tested list of layers --
#                          what `--with <lang>/<n>` expands to
#
# A facet is named by the question the person answers, never by the files the
# answer produces (TypeScript is a dialect, not a build system). Design:
# 2026-10-19__22-11-27__dev-workflow-process__family-type-system-facets-and-grammar.md

[facets.language]
rank = 0
exclusive = false
question = "which language(s); the first is primary"

[facets.runtime]
rank = 1
exclusive = true
question = "where it runs"

[facets.dialect]
rank = 2
exclusive = true
question = "which flavour of the language it is written in"

[facets.build]
rank = 3
exclusive = true
question = "how it is built, bundled or packaged"

[facets.framework]
rank = 4
exclusive = false
question = "what it uses"

[facets.purpose]
rank = 5
exclusive = true
question = "what it is"

# ---------------------------------------------------------------- languages

[languages.python]
layers = ["languages/python"]
default = "python/pypi"

[languages.c-cpp]
layers = ["languages/c-cpp"]
default = "c-cpp/cmake-app"

[languages.js-ts]
layers = ["languages/js-ts"]
default = "js-ts/node-package"

# A pseudo-language: the folder prefix for layer files several languages share
# (the Claude plugin's manifests and marketplace README). Never a project
# language: --language refuses it, `repokit list` and the bare-name lookup do
# not show it, and a layer that implies one of its layers adds no language.
# Proved 2026-10-22 (tests/one-offs/thinking/p4-poc-neutral-purpose/).
[languages.any]
pseudo = true
layers = []
description = "layer files shared by several languages"

# ---------------------------------------------------------------- layers
# Keys are <language>/<name>; the folder is archetypes/<language>/<name>.
# `implies` names other layers (bare names in the same language, or qualified);
# every layer implies its language. `overrides` lists paths a layer may write
# over an earlier layer's file on purpose (the compositions test treats any
# other same-path write as a collision).

[layers."python/pypi"]
facet = "build"
description = "pyproject.toml with a dynamic version, the package (__init__, __main__, cli, _version), tests, and the publish-on-release workflow"

[layers."python/setuppy"]
facet = "build"
description = "setup.py and requirements.txt: git-repokit's Python output before the layers"

[layers."python/script"]
facet = "build"
overrides = [".github/workflows/ci-python.yml"]
description = "a local tool: one module reading VERSION, no packaging, no publish workflow (the simple-projects floor)"

[layers."python/claude-plugin"]
facet = "purpose"
implies = ["any/claude-plugin"]
overrides = [".github/workflows/ci-python.yml", ".repokit-common.toml", "VERSION"]
description = "a Claude Code plugin in plugin/ whose hooks are Python, launched through a small node script (Claude Code runs hooks with node); pytest for its tests; VERSION kept in step with the manifest"

[layers."any/claude-plugin"]
facet = "purpose"
description = "the language-neutral half of a Claude Code plugin: the marketplace manifest at the root, the plugin manifest and the marketplace README in plugin/"

[layers."python/comfyui"]
facet = "purpose"
stub = true
description = "a ComfyUI custom-node package"

[layers."python/django"]
facet = "framework"
stub = true
description = "a Django project"

[layers."python/qt"]
facet = "framework"
stub = true
description = "a Python Qt app (PySide6 or PyQt)"

# js-ts: several layers want package.json, and JSON cannot be appended to, so
# each later layer that needs more in it carries a whole package.json for the
# stack it implies and declares the override (node -> ts -> node-package).

[layers."js-ts/node"]
facet = "runtime"
description = "runs under Node: package.json (ES modules, engines), the version tool keeps its version"

[layers."js-ts/browser"]
facet = "runtime"
stub = true
description = "runs in a browser: index.html, a bundler expected"

[layers."js-ts/ts"]
facet = "dialect"
overrides = ["package.json"]
description = "TypeScript: tsconfig.json (strict, ES2022, NodeNext), build and type-check scripts"

[layers."js-ts/script"]
facet = "build"
implies = ["node"]
description = "a plain script: one .js file run with node, reading VERSION; no build step, no dependencies"

[layers."js-ts/vite"]
facet = "build"
stub = true
implies = ["browser"]
description = "Vite bundler and dev server"

[layers."js-ts/react"]
facet = "framework"
stub = true
description = "React"

[layers."js-ts/svelte"]
facet = "framework"
stub = true
description = "Svelte"

[layers."js-ts/node-package"]
facet = "purpose"
implies = ["node", "ts"]
overrides = ["package.json"]
description = "an npm package: exports map, src/index.ts, node:test tests, publish-on-release"

[layers."js-ts/claude-plugin"]
facet = "purpose"
implies = ["node", "any/claude-plugin"]
overrides = [".repokit-common.toml"]
description = "a Claude Code plugin in plugin/ (manifest, hooks, tests, its marketplace README) with the marketplace manifest at the root; VERSION kept in step with both manifests"

[layers."js-ts/obsidian-plugin"]
facet = "purpose"
stub = true
implies = ["browser"]
description = "an Obsidian plugin: manifest.json + versions.json, esbuild"

[layers."js-ts/browser-extension"]
facet = "purpose"
stub = true
implies = ["browser"]
description = "a WebExtension: manifest v3, a bundler, store packaging"

[layers."js-ts/comfyui-frontend"]
facet = "purpose"
stub = true
implies = ["browser"]
description = "a ComfyUI frontend extension"

[layers."c-cpp/cmake-app"]
facet = "build"
description = "CMake + presets + vcpkg manifest + CTest + 3-OS CI (xormove's shape)"

[layers."c-cpp/cmake-lib"]
facet = "build"
stub = true
description = "library with install/export targets and a package config (starts from cmake-app)"

[layers."c-cpp/msbuild"]
facet = "build"
description = "Visual Studio solution, Windows only"

[layers."c-cpp/minimal"]
facet = "build"
description = "one source file, Makefile + build.bat"

[layers."c-cpp/qt"]
facet = "framework"
stub = true
description = "Qt 6: find_package(Qt6), qt_add_executable, windeployqt"

# ---------------------------------------------------------------- presets
# `layers` lists layer folders in apply order; `languages` is implied by the key.

[archetypes."python/setuppy"]
languages = ["python"]
layers = ["archetypes/python/setuppy"]
description = "setup.py and requirements.txt: git-repokit's Python output before the layers"

[archetypes."python/pypi"]
languages = ["python"]
layers = ["archetypes/python/pypi"]
description = "pyproject.toml with a dynamic version, the package (__init__, __main__, cli, _version), tests, and the publish-on-release workflow: the shape of git-repokit-template's projects"

[archetypes."python/script"]
languages = ["python"]
layers = ["archetypes/python/script"]
description = "a local tool: one module reading VERSION, no packaging, no publish workflow (the simple-projects floor)"

[archetypes."python/claude-plugin"]
languages = ["python"]
layers = ["archetypes/python/claude-plugin", "archetypes/any/claude-plugin"]
description = "a Claude Code plugin with Python hooks in plugin/ (manifest, a SessionStart hook behind a node launcher, pytest tests, the marketplace README) with the marketplace manifest at the root; the shape claude-session-logger keeps, nested"

[archetypes."python/comfyui"]
stub = true
description = "a ComfyUI custom-node package (the template holds its pyproject shape; the node skeleton is not written yet)"

[archetypes."python/django"]
stub = true
description = "a Django project"

[archetypes."python/qt"]
stub = true
description = "a Python Qt app (PySide6 or PyQt)"

[archetypes."js-ts/node-package"]
languages = ["js-ts"]
layers = ["archetypes/js-ts/node", "archetypes/js-ts/ts", "archetypes/js-ts/node-package"]
description = "an npm package in TypeScript: exports map, src/index.ts, node:test tests, publish-on-release"

[archetypes."js-ts/script"]
languages = ["js-ts"]
layers = ["archetypes/js-ts/node", "archetypes/js-ts/script"]
description = "a plain script run with node: one .js file reading VERSION, no build step (the simple-projects floor)"

[archetypes."js-ts/claude-plugin"]
languages = ["js-ts"]
primary = true          # a bare --with claude-plugin, with no language named, is this one
layers = ["archetypes/js-ts/node", "archetypes/js-ts/claude-plugin", "archetypes/any/claude-plugin"]
description = "a Claude Code plugin in plugin/ (manifest, a SessionStart hook, node:test tests, the marketplace README) with the marketplace manifest at the root; add ts for TypeScript"

[archetypes."js-ts/web-vite-react"]
stub = true
description = "a Vite + React + TypeScript site"

[archetypes."js-ts/obsidian-plugin"]
stub = true
description = "an Obsidian plugin (manifest.json + versions.json, esbuild)"

[archetypes."js-ts/browser-extension"]
stub = true
description = "a WebExtension (manifest v3)"

[archetypes."js-ts/comfyui-frontend"]
stub = true
description = "a ComfyUI frontend extension"

[archetypes."c-cpp/cmake-app"]
languages = ["c-cpp"]
layers = ["archetypes/c-cpp/cmake-app"]
description = "CMake + presets + vcpkg manifest + CTest + 3-OS CI (xormove's shape)"

[archetypes."c-cpp/msbuild"]
languages = ["c-cpp"]
layers = ["archetypes/c-cpp/msbuild"]
description = "Visual Studio solution, Windows only"

[archetypes."c-cpp/minimal"]
languages = ["c-cpp"]
layers = ["archetypes/c-cpp/minimal"]
description = "One source file, Makefile + build.bat"

[archetypes."c-cpp/cmake-lib"]
stub = true
description = "Library with install/export targets and a package config (starts from cmake-app)"

[archetypes."c-cpp/qt"]
stub = true
description = "Qt 6 app: find_package(Qt6), qt_add_executable, windeployqt (starts from cmake-app)"
