name: CI (JavaScript/TypeScript)

# Installs with the lockfile when there is one, type-checks when there is a
# tsconfig.json, and runs the package's test script when it defines one.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['20', '22']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install
      shell: bash
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Type-check
      shell: bash
      run: |
        if [ -f tsconfig.json ]; then npx tsc --noEmit -p .; else echo "no tsconfig.json; skipped"; fi

    - name: Test
      shell: bash
      run: npm test --if-present
