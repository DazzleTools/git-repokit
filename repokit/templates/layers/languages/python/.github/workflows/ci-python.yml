name: CI (Python)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/setup.py', '**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install the project
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi
        if [ -f setup.py ] && [ ! -f pyproject.toml ]; then pip install -e .; fi
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Lint with flake8
      shell: bash
      run: |
        pip install flake8
        # The package directory: the first top-level folder holding __init__.py
        PKG_DIR=$(python -c "import pathlib; dirs=[d for d in pathlib.Path('.').iterdir() if d.is_dir() and (d / '__init__.py').exists() and not d.name.startswith('.')]; print(dirs[0] if dirs else '.')")
        echo "Linting: $PKG_DIR"
        # Syntax errors and undefined names stop the build
        flake8 "$PKG_DIR"/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Everything else is reported, never fatal
        flake8 "$PKG_DIR"/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Run tests
      shell: bash
      run: |
        python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Build the package
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine
        python -m build
        twine check dist/*
