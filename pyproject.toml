[build-system]
# bump setuptools so we can use PEP 621 metadata
requires = ["setuptools>=62.3", "wheel"]  # 62.3: recursive ** in package-data
build-backend = "setuptools.build_meta"

[project]
name = "repokit"
version = "0.6.0"
description = "A tool for creating standardized Git repositories with complex branching and worktree workflows"
readme = "README.md"
requires-python = ">=3.7"
# requests: the --publish-to REST path (remote_integration.py imports it)
dependencies = ["requests>=2.25.0"]

[project.scripts]
repokit = "repokit.cli:main"

[project.optional-dependencies]
# keep your formatter/tester/etc here
dev = [
  "pytest>=7.0.0",
  "python-dotenv>=1.0.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
  "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["repokit", "repokit.*"]

[tool.setuptools.package-data]
# Every template at every depth, and the hook files setup-guardrails --legacy
# installs. ("templates/*" shipped none of them: a measured wheel had 0.)
"repokit" = ["templates/**/*", "hooks/*"]

[tool.pytest.ini_options]
# Only the regression suite. private/old_test_runs/ holds whole generated
# repositories from 2025, and tests/one-offs/ holds exploratory scripts.
testpaths = ["tests"]
norecursedirs = ["one-offs", "__pycache__", ".*"]

[tool.repokit-common]
# Paths a public branch must not receive, beyond git-repokit-common's built-in
# list. (.repokit.json is tracked here, so it is not listed.)
private-patterns = ["CLAUDE.md", "convos/", "logs/", "private/", "revisions/"]
