[build-system]
# 77: the PEP 639 licence fields below (an SPDX `license` string and
# `license-files`); it also covers 62.3's recursive ** in package-data
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI's trusted publisher is registered for this name (DazzleTools/git-repokit,
# publish.yml, environment pypi); the command stays `repokit`
name = "git-repokit"
version = "0.9.9"
description = "Create standardized Git repositories: language presets, licences, GitHub setup, and a private notes vault"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dustin Darcy" }]
keywords = ["git", "repository", "scaffolding", "template", "project-generator", "github"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
# 3.10: measured 2026-10-25 (tests/one-offs/thinking/p4-measure-python-floor/):
# the full suite passes on 3.10; 3.9 fails in the repokit-common tooling every
# created project vendors (`str | None` at runtime), and 3.7/3.8 lack
# importlib.resources.files, which loads the templates
requires-python = ">=3.10"
dependencies = [
  # the --publish-to REST path (remote_integration.py imports it)
  "requests>=2.25.0",
  # tomllib is 3.11+; the layer engine reads TOML (layers.py falls back to tomli)
  "tomli>=1.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/DazzleTools/git-repokit"
Repository = "https://github.com/DazzleTools/git-repokit"
Issues = "https://github.com/DazzleTools/git-repokit/issues"
Changelog = "https://github.com/DazzleTools/git-repokit/blob/main/CHANGELOG.md"

[project.scripts]
repokit = "repokit.cli:main"

[project.optional-dependencies]
# what the test suite needs beyond the package (CI installs `.[test]`)
test = [
  "pytest>=7.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "build>=1.0",
]
# keep your formatter/tester/etc here
dev = [
  "pytest>=7.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "build>=1.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
  "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["repokit", "repokit.*"]

[tool.setuptools]
# The layer tree holds dotfiles (.gitignore.rkappend, .repokit-common.toml)
# and dot directories (.github/); "templates/**/*" skips both (measured:
# 1 of 5 probe files shipped), so MANIFEST.in grafts the whole tree.
include-package-data = true

[tool.setuptools.package-data]
# Every template at every depth, and the hook files setup-guardrails --legacy
# installs. ("templates/*" shipped none of them: a measured wheel had 0.)
"repokit" = ["templates/**/*", "hooks/*", "licenses/*.txt", "licenses/LICENSES.md"]

[tool.pytest.ini_options]
# Only the regression suite. private/old_test_runs/ holds whole generated
# repositories from 2025, and tests/one-offs/ holds exploratory scripts.
testpaths = ["tests"]
norecursedirs = ["one-offs", "__pycache__", ".*"]
# pytest-asyncio 0.24+ warns on every run until this is set; git-repokit has no
# async fixtures, so the default scope is the right one.
asyncio_default_fixture_loop_scope = "function"

[tool.repokit-common]
# Paths a public branch must not receive, beyond git-repokit-common's built-in
# list. (.repokit.json is tracked here, so it is not listed.)
private-patterns = ["CLAUDE.md", "convos/", "logs/", "private/", "revisions/"]
# git-repokit's version is computed in repokit/__version__.py, not a shape
# sync-versions.py writes: the hooks say nothing about it.
versioning = "off"
# What a push runs: the unit class (106 tests, about 4 s). The complete suite
# (about 7 minutes; 89 integration tests at a 5 s floor each, measured
# 2026-10-22) runs in CI and before a tag: `python -m pytest -q`.
test-command = "python -m pytest -q -m unit"
